# YOVNOK on one small server (DEPLOY.md): the game and Caddy for HTTPS in front
# of it. New images are installed by a systemd timer (yovnok-update.timer).
#
# Lives at /opt/yovnok on the Droplet with deploy/Caddyfile and a .env file
# holding DOMAIN, WS_DOMAIN, CF_RANGES, STATS_PASSWORD and STATS_SALT (never
# committed).

services:
  game:
    image: ghcr.io/kpoke/yovnok:latest
    restart: unless-stopped
    environment:
      MODE: solo
      # Cloudflare → Caddy → here: client IPs come from Cloudflare's header.
      TRUST_PROXY: "1"
      ALLOWED_ORIGINS: https://${DOMAIN}
      # The page opens the game socket here: straight to this server, not
      # through Cloudflare (half the round trip from West Africa).
      PUBLIC_WS_URL: wss://${WS_DOMAIN}/ws
      MAX_ROOMS: "3"
      MAX_PLAYERS: "20"
      # The hard edge of the $10/month budget: 1,000 GB is the Droplet's
      # allowance; stop admitting new players well before it.
      BANDWIDTH_BUDGET_GB: "850"
      DATA_DIR: /data
      STATS_PASSWORD: ${STATS_PASSWORD}
      STATS_SALT: ${STATS_SALT}
    volumes:
      - gamedata:/data
    # 1 GB server: leave room for Caddy and the OS.
    mem_limit: 700m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      WS_DOMAIN: ${WS_DOMAIN}
      # Cloudflare's published address ranges (cloudflare.com/ips), space-separated.
      CF_RANGES: ${CF_RANGES}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./origin.pem:/etc/caddy/origin.pem:ro
      - ./origin.key:/etc/caddy/origin.key:ro
      - caddydata:/data
    depends_on: [game]

volumes:
  gamedata:
  caddydata:
