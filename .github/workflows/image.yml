# Build the server image on every push to main and publish it to the GitHub
# Container Registry (free for public repositories). The server pulls new
# images itself (Watchtower, deploy/docker-compose.yml) — no SSH keys or
# server secrets ever live in GitHub.
name: image

on:
  push:
    branches: [main]
    # Documentation does not change the image.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kpoke/yovnok:latest
            ghcr.io/kpoke/yovnok:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
